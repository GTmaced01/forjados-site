name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://oxdskhrbfslrjakutoye.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_GgoNAO4GS3fxXhAhle5wsQ_FUPcJx_e
          NEXT_PUBLIC_SITE_URL: https://forjados-site-theta.vercel.app
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
